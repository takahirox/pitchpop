plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.pitchpop'
    compileSdk 35
    ndkVersion '26.1.10909125'
    defaultConfig {
        applicationId 'com.pitchpop'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
}
dependencies { testImplementation 'junit:junit:4.13.2' }

def hostEchoDir = layout.buildDirectory.dir('echo-host')
tasks.register('configureHostEcho', Exec) {
    inputs.dir('src/main/cpp')
    outputs.file(hostEchoDir.map { it.file('CMakeCache.txt') })
    environment 'JAVA_HOME', System.getProperty('java.home')
    commandLine "${android.sdkDirectory}/cmake/3.22.1/bin/cmake", '-S', file('src/main/cpp'),
        '-B', hostEchoDir.get().asFile, '-DCMAKE_BUILD_TYPE=Release', '-DPITCHPOP_JNI_TESTS=ON'
}
tasks.register('buildHostEcho', Exec) {
    dependsOn 'configureHostEcho'
    inputs.dir('src/main/cpp')
    outputs.file(hostEchoDir.map { it.file(System.mapLibraryName('pitchpop_echo')) })
    commandLine "${android.sdkDirectory}/cmake/3.22.1/bin/cmake", '--build', hostEchoDir.get().asFile, '--parallel', '4'
}
tasks.withType(Test).configureEach {
    dependsOn 'buildHostEcho'
    inputs.file(hostEchoDir.map { it.file(System.mapLibraryName('pitchpop_echo')) })
    inputs.dir('src/main/assets/audio')
    systemProperty 'java.library.path', hostEchoDir.get().asFile.absolutePath
    systemProperty 'pitchpop.assets', file('src/main/assets').absolutePath
}
